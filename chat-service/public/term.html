<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no, interactive-widget=resizes-content">
<meta name="theme-color" content="#141413">
<meta name="color-scheme" content="dark">
<meta name="deployment" content="">
<meta name="build" content="">
<title>Terminal · TripleC</title>
<link rel="icon" href="/chat/pwa-icons/icon-192.png">
<link rel="stylesheet" href="/chat/vendor/xterm.css">
<link rel="stylesheet" href="/chat/style.css">
<link rel="stylesheet" href="/chat/term.css">
</head>
<body class="term-page">

<!--
  A terminal on this box: the real Claude Code CLI, in the tmux session `cc` would
  open for this project or slot. Inside a mux pane (`?embed=1`) it is the whole
  frame; on its own — the link a mux pane hands to a phone — it has a bar with
  where it is and a row of the keys a phone keyboard does not have. See term.js.
-->
<header class="term-bar">
  <a class="term-back" href="/chat/" aria-label="Back to the chats">‹</a>
  <span id="term-title" class="term-title">Terminal</span>
  <span id="term-status" class="term-status">connecting…</span>
  <!-- A mux pane's header controls, for the page on its own — see "the bar" in term.js. -->
  <span class="term-acts">
    <a class="term-act term-act-word" data-act="kind" href="/chat/mux"></a>
    <a class="term-act term-act-word" data-act="shell" href="/chat/mux" title="Show a bare shell in this slot instead — Claude keeps running">$&nbsp;Shell</a>
    <button type="button" class="term-act" data-act="listen" title="What Claude last said here — read it aloud, or talk it over">🔊</button>
    <button type="button" class="term-act" data-act="attach" title="Attach a file — an image, a PDF — to what you type here">📎</button>
    <button type="button" class="term-act" data-act="run" title="Run your own command line in this slot's terminal — an environment variable, claude --resume &lt;id&gt;">❯…</button>
  </span>
  <button type="button" id="term-font-btn" class="term-font-btn" aria-label="Font and size" title="Font and size">Aa</button>
</header>

<div id="term" class="term-host"></div>

<!-- The font: this browser's choice, for every terminal it shows. See term.js. -->
<div id="term-font" class="term-font hidden" role="dialog" aria-label="Terminal font">
  <label class="term-font-row">Font
    <select id="term-font-family"></select>
  </label>
  <input id="term-font-custom" class="hidden" type="text" spellcheck="false" autocomplete="off"
         placeholder="An installed font's name, then Enter" aria-label="Font name">
  <div class="term-font-row">Size
    <span class="term-font-steps">
      <button type="button" data-size="-1" aria-label="Smaller">−</button>
      <output id="term-font-size">13px</output>
      <button type="button" data-size="1" aria-label="Larger">+</button>
    </span>
  </div>
  <p id="term-font-sample" class="term-font-sample">0O 1lI {}[] =&gt; ~/src ✓ ❯</p>
  <div class="term-font-actions">
    <button type="button" id="term-font-reset">Default</button>
    <button type="button" id="term-font-done">Done</button>
  </div>
</div>

<div id="term-ended" class="term-ended hidden" role="status">
  <p id="term-ended-text">This terminal's session has ended.</p>
  <button type="button" id="term-restart" class="wide">Start Claude here again</button>
</div>

<!-- Only where there is no physical keyboard. A phone's own keyboard has no Esc,
     Tab or arrows, and typing into a terminal gets none of its autocorrect or
     dictation, so there is a line of plain text input as well: what is typed there
     goes to Claude as if typed into the terminal, then Enter. -->
<form id="term-compose" class="term-compose" autocomplete="off">
  <input id="term-line" type="text" enterkeyhint="send" autocapitalize="sentences"
         placeholder="Type to Claude…" aria-label="Type to the terminal">
  <button type="submit" aria-label="Send, then Enter">⏎</button>
</form>
<nav id="term-keys" class="term-keys" aria-label="Keys a phone keyboard does not have">
  <button type="button" data-act="copy" aria-label="Copy from the screen">Copy</button>
  <button type="button" data-key="esc">Esc</button>
  <button type="button" data-key="enter" aria-label="Enter">⏎</button>
  <button type="button" data-key="up" aria-label="Up">↑</button>
  <button type="button" data-key="down" aria-label="Down">↓</button>
  <button type="button" data-key="d1">1</button>
  <button type="button" data-key="d2">2</button>
  <button type="button" data-key="d3">3</button>
  <button type="button" data-key="d4">4</button>
  <button type="button" data-key="stab" aria-label="Shift-Tab">⇧Tab</button>
  <button type="button" data-key="tab">Tab</button>
  <button type="button" data-key="left" aria-label="Left">←</button>
  <button type="button" data-key="right" aria-label="Right">→</button>
  <button type="button" data-key="bksp" aria-label="Backspace">⌫</button>
  <button type="button" data-key="ctrlc" aria-label="Control-C">^C</button>
  <button type="button" data-act="attach" aria-label="Attach a file">📎</button>
</nav>
<!-- The second row: Ctrl and Alt for whatever comes next — a key here, or a letter
     from the phone's keyboard — and the chords Claude Code and a shell use most. -->
<nav id="term-more" class="term-keys" aria-label="Control keys and symbols">
  <button type="button" data-mod="ctrl" aria-pressed="false" aria-label="Control, for the next key">Ctrl</button>
  <button type="button" data-mod="alt" aria-pressed="false" aria-label="Alt, for the next key">Alt</button>
  <button type="button" data-key="sendnow" aria-label="Control-X Control-S: send now">^X^S</button>
  <button type="button" data-key="ctrlx" aria-label="Control-X">^X</button>
  <button type="button" data-key="ctrls" aria-label="Control-S">^S</button>
  <button type="button" data-key="newline" aria-label="New line without sending">⇧⏎</button>
  <button type="button" data-key="escesc" aria-label="Escape twice">Esc Esc</button>
  <button type="button" data-key="ctrlo" aria-label="Control-O">^O</button>
  <button type="button" data-key="ctrlr" aria-label="Control-R">^R</button>
  <button type="button" data-key="ctrlbb" aria-label="Control-B twice: run in the background">^B^B</button>
  <button type="button" data-key="ctrlt" aria-label="Control-T">^T</button>
  <button type="button" data-key="ctrlg" aria-label="Control-G">^G</button>
  <button type="button" data-key="ctrld" aria-label="Control-D">^D</button>
  <button type="button" data-key="ctrlu" aria-label="Control-U">^U</button>
  <button type="button" data-key="ctrlw" aria-label="Control-W">^W</button>
  <button type="button" data-key="ctrlk" aria-label="Control-K">^K</button>
  <button type="button" data-key="ctrla" aria-label="Control-A">^A</button>
  <button type="button" data-key="ctrle" aria-label="Control-E">^E</button>
  <button type="button" data-key="ctrll" aria-label="Control-L">^L</button>
  <button type="button" data-key="home">Home</button>
  <button type="button" data-key="end">End</button>
  <button type="button" data-key="pgup" aria-label="Page up">PgUp</button>
  <button type="button" data-key="pgdn" aria-label="Page down">PgDn</button>
  <button type="button" data-key="del" aria-label="Delete">Del</button>
  <button type="button" data-text="/">/</button>
  <button type="button" data-text="!">!</button>
  <button type="button" data-text="#">#</button>
  <button type="button" data-text="@">@</button>
  <button type="button" data-text="?">?</button>
  <button type="button" data-text="|">|</button>
  <button type="button" data-text="~">~</button>
  <button type="button" data-text="`">`</button>
  <button type="button" data-text="-">-</button>
  <button type="button" data-text="_">_</button>
  <button type="button" data-text="\">\</button>
  <button type="button" data-text="$">$</button>
  <button type="button" data-text="&amp;">&amp;</button>
  <button type="button" data-text="*">*</button>
  <button type="button" data-text="{">{</button>
  <button type="button" data-text="}">}</button>
  <button type="button" data-text="[">[</button>
  <button type="button" data-text="]">]</button>
  <button type="button" data-text="&lt;">&lt;</button>
  <button type="button" data-text="&gt;">&gt;</button>
</nav>
<input id="term-file" type="file" multiple hidden>

<!-- Copy, on a phone: the screen as text the phone can select, and its links. -->
<div id="term-copy" class="term-copy hidden" role="dialog" aria-label="Copy from the screen">
  <div class="term-copy-bar">
    <button type="button" id="term-copy-all">Copy all</button>
    <button type="button" id="term-copy-close" aria-label="Close">✕</button>
  </div>
  <div id="term-copy-links" class="term-copy-links"></div>
  <textarea id="term-copy-text" readonly spellcheck="false"></textarea>
</div>
<div id="term-toast" class="term-toast hidden" role="status"></div>

<script src="/chat/vendor/xterm.js"></script>
<script src="/chat/vendor/addon-fit.js"></script>
<script src="/chat/term.js"></script>
</body>
</html>
