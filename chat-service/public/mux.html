<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="color-scheme" content="dark">
<meta name="deployment" content="">
<meta name="build" content="">
<title>Mux · TripleC</title>
<link rel="icon" href="/chat/pwa-icons/icon-192.png">
<link rel="stylesheet" href="/chat/style.css">
<link rel="stylesheet" href="/chat/mux.css">
</head>
<body class="mux">

<!--
  On a phone there is room for one pane, so the sidebar is a drawer and this bar
  is what stays: the way to the drawer, and a tab per pane. Hidden on a desktop.
-->
<header class="mux-mobilebar">
  <button type="button" id="mux-menu" class="mux-menu" aria-label="Projects and slots" aria-controls="mux-side" aria-expanded="false">☰</button>
  <nav id="mux-tabs" class="mux-tabs" aria-label="Panes"></nav>
</header>
<div id="mux-scrim" class="mux-scrim"></div>

<!--
  The desktop surface: every project's worktree slots down the side, and the
  conversations in them side by side. Each pane is the chat app itself, framed
  (`/chat/?embed=1`), so a conversation started here is the same conversation the
  phone opens from its list — owned by claude-chat.service, not by this page, and
  still running after the laptop that started it has shut. See mux.js.
-->
<aside id="mux-side" class="mux-side">
  <header class="mux-head">
    <span class="mux-brand">Mux</span>
    <a class="mux-link" href="/chat/?chat=1" title="The chat list — deprecated in favour of this page">Chats</a>
    <a class="mux-link" href="/chat/admin">Box</a>
    <!-- The box's own Chrome, in a pane. Shown by mux.js when this install has one. -->
    <a class="mux-link" id="mux-browser" href="/chat/browser" hidden title="Chrome on the box — the same browser a Claude here can drive">Browser</a>
  </header>

  <div class="mux-layouts" role="group" aria-label="Panes on screen">
    <button type="button" data-layout="1" title="One pane">1</button>
    <button type="button" data-layout="2" title="Two side by side">2</button>
    <button type="button" data-layout="3" title="Three side by side">3</button>
    <button type="button" data-layout="4" title="Two by two">4</button>
    <button type="button" data-layout="6" title="Three by two">6</button>
    <button type="button" data-layout="8" title="Four by two">8</button>
  </div>

  <!-- What a + opens. A chat is the phone's chat app in a pane; a terminal is the
       real Claude Code CLI, in the tmux session `cc` keeps for that slot. Each
       pane's header switches between the two for its own slot. A shell is a bare
       bash in the slot, in a tmux session of its own beside Claude's. -->
  <div class="mux-kinds" role="group" aria-label="New panes open as">
    <span class="mux-kinds-label">New</span>
    <button type="button" data-kind="chat" title="New panes open the chat — deprecated: use a terminal">Chat <span class="mux-deprecated-tag">deprecated</span></button>
    <button type="button" data-kind="terminal" title="New panes open Claude Code in a terminal">Terminal</button>
    <button type="button" data-kind="shell" title="New panes open a bare shell in the slot — no Claude">Shell</button>
  </div>

  <!-- Adding a project lives beside the list it adds to. It used to be only in the
       chat's "New chat" screen, which is deprecated with the chat. -->
  <div class="mux-filter-row">
    <input id="mux-filter" class="mux-filter" type="search" placeholder="Filter projects" autocomplete="off">
    <button type="button" id="mux-new-project" class="mux-add" title="Add a project: clone one from GitHub, or create one" aria-label="Add a project">+</button>
  </div>
  <div id="mux-projects" class="mux-projects">
    <div class="mux-empty">Loading…</div>
  </div>

  <footer class="mux-foot">
    <button type="button" id="mux-alerts" class="mux-foot-btn">Desktop alerts: off</button>
    <!-- Where a tapped push notification lands on this device. See `opens` in sw.js. -->
    <button type="button" id="mux-opens" class="mux-foot-btn" title="Where tapping a push notification takes you, on this device">Notifications open: the editor</button>
    <p class="mux-hint">Closing a pane, this tab or the laptop stops nothing. Every
      conversation keeps running on the box and is in the phone's list, labelled
      with its slot.</p>
  </footer>
</aside>

<main id="mux-grid" class="mux-grid"></main>

<!-- Adding a project: clone a repository, or start an empty one. The same routes
     the chat's New chat screen used, and the same server-side checks behind them. -->
<div id="mux-add-sheet" class="sheet hidden">
  <div class="sheet-backdrop" data-close-add></div>
  <div class="sheet-body mux-dialog" role="dialog" aria-modal="true" aria-labelledby="mux-add-title">
    <h2 id="mux-add-title">Add a project</h2>

    <div class="section-label">Clone from GitHub</div>
    <form id="mux-form-clone" class="inline-form">
      <input id="mux-input-clone" type="text" placeholder="owner/repo" autocomplete="off"
             autocapitalize="none" autocorrect="off" spellcheck="false" required>
      <button type="submit">Clone</button>
    </form>
    <div class="opt-row">
      <button type="button" id="mux-browse-repos" class="linkish">Browse my repositories</button>
    </div>
    <div id="mux-repo-picker" class="mux-repo-picker"></div>
    <p class="hint mux-status" id="mux-clone-status"></p>

    <div class="section-label">Create a new project</div>
    <form id="mux-form-project" class="inline-form">
      <input id="mux-input-project" type="text" placeholder="project-name" autocomplete="off"
             autocapitalize="none" autocorrect="off" spellcheck="false"
             pattern="[A-Za-z0-9._\-]+" required>
      <button type="submit">Create</button>
    </form>
    <label class="opt-row"><input type="checkbox" id="mux-opt-github" checked> Create a GitHub repo and push</label>
    <label class="opt-row"><input type="checkbox" id="mux-opt-private" checked> Private repo</label>
    <p class="hint mux-status" id="mux-project-status"></p>

    <button type="button" data-close-add class="wide subtle">Close</button>
  </div>
</div>

<!-- One project: what it still holds, cloning another repository into it, and
     removing it from this machine once nothing in it exists only here. -->
<div id="mux-project-sheet" class="sheet hidden">
  <div class="sheet-backdrop" data-close-project></div>
  <div class="sheet-body mux-dialog" role="dialog" aria-modal="true" aria-labelledby="mux-project-title">
    <h2 id="mux-project-title">Project</h2>
    <div id="mux-project-body" class="mux-project-body">Checking…</div>
    <button type="button" id="mux-project-remove" class="wide danger hidden">Push &amp; delete from this machine</button>
    <button type="button" data-close-project class="wide subtle">Close</button>
  </div>
</div>

<div id="toast" class="toast hidden"></div>
<script src="/chat/mux.js"></script>
<!-- Read aloud and Talk it over, the editor overlay's, in a mode for this page: see
     `window.cmoHost` at the top of mux.js. Shipped into the chat service's public/
     by deploy.sh, beside sw.js, and loaded last so a failure in it costs the voice
     and nothing else. -->
<script src="/chat/mobile-overlay.js" defer></script>
</body>
</html>
